# Broker MQTT para pruebas locales.
# ATENCIÓN: allow_anonymous true y sin TLS solo son aceptables en tu equipo (el puerto queda atado a 127.0.0.1).
# Para usarlo en una red real: password_file con mosquitto_passwd, listener TLS (8883) y ACL por tópico.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
