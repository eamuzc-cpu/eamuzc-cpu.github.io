# Telegraf: se suscribe a los tópicos MQTT de la planta, interpreta el JSON y lo escribe en InfluxDB 2.
# Esquema de energía (el mismo que publica el ESP32):  {"id","ts","v","i","p","pf","f","e"}   -> planta/energia/<id>
# Esquema de proceso (pasteurizador simulado):         {"id","ts","temp","sp","flujo","desvio","vapor"} -> planta/proceso/<id>

[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "5s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["planta/energia/+"]       # el «+» no coincide con .../estado
  client_id = "telegraf-energia"
  qos = 0
  persistent_session = false
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "energia"
    timestamp_path = "ts"
    timestamp_format = "unix"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "id"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "v"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "i"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "p"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pf"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "f"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "e"
      type = "float"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["planta/proceso/+"]
  client_id = "telegraf-proceso"
  qos = 0
  persistent_session = false
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "proceso"
    timestamp_path = "ts"
    timestamp_format = "unix"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "id"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temp"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sp"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "flujo"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "desvio"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "vapor"
      type = "float"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
