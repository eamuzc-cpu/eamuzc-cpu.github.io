.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.panel h2 { margin: 0 0 8px; font: 600 11px var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--mut); }

.ok { color: var(--green); } .warn { color: var(--amber); } .bad { color: var(--red); }

  const { c, w, h } = prep($('cvPa'))
  const f = p.pareto, L = 38, R = 38, T = 12, B = 48, bw = (w - L - R) / Math.max(1, f.length)
  const max = Math.max(...f.map((x) => x.min), 1), y = (v) => T + (1 - v / max) * (h - T - B), y2 = (v) => T + (1 - v / 100) * (h - T - B)
  c.strokeStyle = '#13203a'; c.fillStyle = '#64748b'; c.textAlign = 'right'
  for (let k = 0; k <= 4; k++) { const v = (max * k) / 4; c.beginPath(); c.moveTo(L, y(v)); c.lineTo(w - R, y(v)); c.stroke(); c.fillText(v.toFixed(0), L - 5, y(v) + 4) }
  c.textAlign = 'left'; for (const v of [0, 50, 80, 100]) c.fillText(v + ' %', w - R + 5, y2(v) + 4)
  f.forEach((x, i) => {
    const xx = L + i * bw + bw * 0.15, ww = bw * 0.7
    c.fillStyle = CAUSA_COL[x.causa]; c.fillRect(xx, y(x.min), ww, y(0) - y(x.min))
    c.fillStyle = '#e2e8f0'; c.textAlign = 'center'; c.fillText(x.min.toFixed(0), xx + ww / 2, y(x.min) - 4)
    c.save(); c.translate(xx + ww / 2, h - B + 8); c.rotate(0.5); c.fillStyle = '#94a3b8'; c.textAlign = 'left'; c.fillText(x.nombre.length > 18 ? x.nombre.slice(0, 17) + '…' : x.nombre, 0, 0); c.restore()
  })
  c.strokeStyle = '#e879f9'; c.lineWidth = 1.6; c.beginPath()
  f.forEach((x, i) => { const px = L + i * bw + bw / 2; i ? c.lineTo(px, y2(x.acum)) : c.moveTo(px, y2(x.acum)) }); c.stroke()
  f.forEach((x, i) => { c.fillStyle = '#e879f9'; c.beginPath(); c.arc(L + i * bw + bw / 2, y2(x.acum), 3, 0, 7); c.fill() })
  c.lineWidth = 1
}
window.addEventListener('resize', render)
render()
</script>
